<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/favicon-32x32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}" sizes="180x180">
<meta name="theme-color" content="#2b6475">

<style>
  :root {
    --course-ink: #202a31;
    --course-muted: #687680;
    --course-paper: #f3f6f7;
    --course-panel: #ffffff;
    --course-line: #cfd8dd;
    --course-accent: #2b6475;
    --course-accent-soft: #e6eef1;
  }

  body {
    background: var(--course-paper);
    color: var(--course-ink);
  }

  .markdown-body {
    max-width: 1080px;
    color: var(--course-ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16.5px;
    line-height: 1.62;
  }

  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3,
  .markdown-body h4,
  .markdown-body h5,
  .markdown-body h6 {
    color: var(--course-ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-weight: 400;
    letter-spacing: 0;
  }

  .markdown-body b,
  .markdown-body strong {
    font-weight: 400;
  }

  .markdown-body h1 {
    border-bottom: 2px solid var(--course-accent);
    font-size: 2.05rem;
    padding-bottom: 0.35em;
  }

  .markdown-body h2 {
    border-bottom: 1px solid var(--course-line);
    font-size: 1.45rem;
    margin-top: 2.1em;
    padding-bottom: 0.25em;
  }

  .markdown-body a {
    color: #1f6579;
    text-decoration-thickness: 0.08em;
    text-underline-offset: 0.16em;
  }

  .markdown-body table {
    border-collapse: separate;
    border-spacing: 0;
    border: 1px solid var(--course-line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--course-panel);
  }

  .markdown-body table th {
    background: var(--course-accent-soft);
    color: var(--course-ink);
    font-weight: 400;
  }

  .markdown-body table td,
  .markdown-body table th {
    border-color: var(--course-line);
    padding: 0.65rem 0.8rem;
  }

  .schedule-note {
    margin: 1rem 0 1.25rem;
    color: var(--course-muted);
    font-size: 0.92rem;
  }

  .schedule-board {
    margin: 1.25rem 0 2.5rem;
    border-top: 2px solid var(--course-ink);
  }

  .schedule-head,
  .schedule-week {
    display: grid;
    grid-template-columns: 110px minmax(0, 1fr) minmax(0, 1fr) 170px;
  }

  .schedule-head {
    min-height: 2.5rem;
    align-items: center;
    color: var(--course-muted);
    font-size: 0.72rem;
    font-weight: 400;
    text-transform: uppercase;
  }

  .schedule-head > span,
  .schedule-week > div {
    padding: 0.65rem 0.8rem;
    border-left: 1px solid var(--course-line);
  }

  .schedule-head > span:first-child,
  .schedule-week > div:first-child {
    border-left: 0;
    padding-left: 0;
  }

  .schedule-week {
    min-height: 4.5rem;
    border-top: 1px solid var(--course-line);
  }

  .week-stamp,
  .class-slot,
  .deliverable {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .week-number {
    font-size: 0.82rem;
    font-weight: 400;
  }

  .week-date {
    margin-top: 0.08rem;
    color: var(--course-muted);
    font-size: 0.76rem;
  }

  .class-slot,
  .deliverable {
    font-size: 0.88rem;
    line-height: 1.4;
  }

  .class-slot p {
    margin: 0;
  }

  .class-slot.muted {
    color: var(--course-muted);
  }

  .deliverable {
    color: var(--course-accent);
    font-weight: 400;
  }

  @media (max-width: 820px) {
    .markdown-body {
      font-size: 16px;
    }

    .schedule-head,
    .schedule-week {
      grid-template-columns: 74px minmax(0, 1fr) minmax(0, 1fr);
    }

    .deliverable-heading {
      display: none;
    }

    .schedule-head > span,
    .schedule-week > div {
      padding: 0.58rem 0.5rem;
    }

    .schedule-week {
      min-height: 5rem;
    }

    .class-slot,
    .deliverable {
      overflow-wrap: anywhere;
      font-size: 0.78rem;
    }

    .deliverable {
      grid-column: 2 / 4;
      min-height: 2rem;
      border-top: 1px solid var(--course-line);
    }

    .deliverable:not(.empty)::before {
      content: "Due: ";
      color: var(--course-muted);
      font-weight: 400;
    }

    .deliverable.empty {
      display: none;
    }
  }
</style>
