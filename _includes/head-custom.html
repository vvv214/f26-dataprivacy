<style>
  :root {
    --course-ink: #17231f;
    --course-muted: #5e6b64;
    --course-paper: #fbfaf6;
    --course-panel: #fffefa;
    --course-line: #d8d1c4;
    --course-moss: #2f6f64;
    --course-moss-soft: #e7f0ed;
    --course-clay: #a94f34;
    --course-clay-soft: #f7e8df;
    --course-gold: #c9902e;
  }

  body {
    background:
      linear-gradient(180deg, rgba(47, 111, 100, 0.08), rgba(255, 255, 255, 0) 240px),
      var(--course-paper);
    color: var(--course-ink);
  }

  .markdown-body {
    max-width: 1080px;
    color: var(--course-ink);
    font-family: "Avenir Next", "Source Sans Pro", Helvetica, sans-serif;
    font-size: 17px;
    line-height: 1.65;
  }

  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3 {
    color: var(--course-ink);
    font-family: Charter, Georgia, serif;
    letter-spacing: 0;
  }

  .markdown-body h1 {
    border-bottom: 3px solid var(--course-moss);
    padding-bottom: 0.35em;
  }

  .markdown-body h2 {
    border-bottom: 1px solid var(--course-line);
    margin-top: 2.1em;
    padding-bottom: 0.25em;
  }

  .markdown-body a {
    color: #1e665d;
    text-decoration-thickness: 0.08em;
    text-underline-offset: 0.16em;
  }

  .markdown-body table {
    border-collapse: separate;
    border-spacing: 0;
    border: 1px solid var(--course-line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--course-panel);
  }

  .markdown-body table th {
    background: #edf3f1;
    color: var(--course-ink);
    font-weight: 700;
  }

  .markdown-body table td,
  .markdown-body table th {
    border-color: var(--course-line);
    padding: 0.65rem 0.8rem;
  }

  .schedule-note {
    border-left: 5px solid var(--course-moss);
    margin: 1.2rem 0 1.6rem;
    padding: 0.95rem 1.05rem;
    background: var(--course-moss-soft);
    color: #24342f;
    border-radius: 0 8px 8px 0;
  }

  .schedule-board {
    display: grid;
    gap: 0.85rem;
    margin: 1.5rem 0 2.5rem;
  }

  .schedule-week {
    display: grid;
    grid-template-columns: minmax(112px, 0.75fr) minmax(0, 1.35fr) minmax(0, 1.35fr) minmax(140px, 0.85fr);
    align-items: stretch;
    background: var(--course-panel);
    border: 1px solid var(--course-line);
    border-radius: 8px;
    box-shadow: 0 8px 22px rgba(23, 35, 31, 0.06);
    overflow: hidden;
  }

  .schedule-week > div {
    padding: 0.95rem 1rem;
    border-left: 1px solid var(--course-line);
  }

  .schedule-week > div:first-child {
    border-left: 0;
  }

  .week-stamp {
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: #f2eee4;
    gap: 0.2rem;
  }

  .week-number {
    color: var(--course-clay);
    font-family: Charter, Georgia, serif;
    font-size: 1.1rem;
    font-weight: 700;
  }

  .week-date {
    color: var(--course-muted);
    font-size: 0.88rem;
  }

  .slot-label {
    display: block;
    margin-bottom: 0.28rem;
    color: var(--course-moss);
    font-size: 0.74rem;
    font-weight: 800;
    letter-spacing: 0;
    text-transform: uppercase;
  }

  .class-slot p {
    margin: 0;
  }

  .class-slot.muted {
    background: #f8f4ec;
    color: var(--course-muted);
  }

  .deliverable {
    display: flex;
    align-items: center;
    background: #f8fbfa;
    color: var(--course-ink);
    font-weight: 700;
  }

  .deliverable span {
    display: inline-block;
    border: 1px solid rgba(47, 111, 100, 0.32);
    border-radius: 999px;
    padding: 0.28rem 0.64rem;
    background: var(--course-moss-soft);
  }

  .deliverable.empty {
    color: #8a948e;
    font-weight: 500;
  }

  .break-week {
    border-color: #e0bca8;
  }

  .break-week .week-stamp,
  .break-week .class-slot.muted {
    background: var(--course-clay-soft);
  }

  .break-week .slot-label,
  .break-week .week-number {
    color: var(--course-clay);
  }

  .milestone {
    border-color: rgba(201, 144, 46, 0.5);
  }

  .milestone .deliverable span {
    border-color: rgba(201, 144, 46, 0.55);
    background: #fff3cf;
  }

  @media (max-width: 820px) {
    .markdown-body {
      font-size: 16px;
    }

    .schedule-week {
      grid-template-columns: 1fr;
    }

    .schedule-week > div {
      border-left: 0;
      border-top: 1px solid var(--course-line);
    }

    .schedule-week > div:first-child {
      border-top: 0;
    }

    .deliverable {
      min-height: 3.2rem;
    }
  }
</style>
