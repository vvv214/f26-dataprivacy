<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/favicon-32x32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}" sizes="180x180">
<meta name="theme-color" content="#153f35">

<style>
  :root {
    --course-ink: #151a17;
    --course-muted: #66716b;
    --course-paper: #f7f8f5;
    --course-panel: #ffffff;
    --course-line: #d9ded9;
    --course-accent: #176a55;
    --course-accent-dark: #153f35;
    --course-accent-soft: #e3efe9;
    --course-warm: #b95632;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background: var(--course-paper);
    color: var(--course-ink);
  }

  .markdown-body {
    max-width: 1180px;
    color: var(--course-ink);
    font-family: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.6;
  }

  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3 {
    color: var(--course-ink);
    font-family: "Iowan Old Style", Charter, Georgia, serif;
    letter-spacing: 0;
  }

  .markdown-body > h1 {
    margin: 4.5rem 0 1.5rem;
    border: 0;
    font-size: 3.25rem;
    line-height: 1.05;
  }

  .markdown-body > h2 {
    margin-top: 3.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--course-line);
    border-bottom: 0;
  }

  .markdown-body a {
    color: var(--course-accent);
    text-decoration-thickness: 0.08em;
    text-underline-offset: 0.18em;
  }

  .course-home a,
  .interior-nav a {
    text-decoration: none;
  }

  .course-nav,
  .interior-nav {
    display: flex;
    min-height: 4.5rem;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
    border-bottom: 1px solid var(--course-line);
    font-size: 0.9rem;
  }

  .course-brand {
    color: var(--course-ink) !important;
    font-weight: 800;
  }

  .course-nav-links {
    display: flex;
    align-items: center;
    gap: 1.55rem;
  }

  .course-nav-links a,
  .interior-nav > a:last-child {
    color: var(--course-muted);
  }

  .course-nav-links a:hover,
  .interior-nav > a:last-child:hover {
    color: var(--course-ink);
  }

  .course-hero {
    padding: 6.5rem 0 4rem;
  }

  .hero-kicker,
  .section-kicker {
    margin: 0 0 1.1rem;
    color: var(--course-accent);
    font-size: 0.76rem;
    font-weight: 800;
    letter-spacing: 0;
    text-transform: uppercase;
  }

  .course-hero h1 {
    max-width: 880px;
    margin: 0;
    border: 0;
    font-size: 5rem;
    font-weight: 500;
    line-height: 0.98;
  }

  .hero-lede {
    max-width: 850px;
    margin: 2rem 0 0;
    color: #303832;
    font-size: 1.65rem;
    line-height: 1.42;
  }

  .hero-actions {
    display: flex;
    align-items: center;
    gap: 1.4rem;
    margin-top: 2.4rem;
  }

  .primary-action,
  .secondary-action {
    display: inline-flex;
    min-height: 2.9rem;
    align-items: center;
    justify-content: center;
    font-size: 0.92rem;
    font-weight: 700;
  }

  .primary-action {
    border: 1px solid var(--course-accent-dark);
    border-radius: 4px;
    padding: 0.65rem 1rem;
    background: var(--course-accent-dark);
    color: #ffffff !important;
  }

  .primary-action:hover {
    background: var(--course-accent);
  }

  .secondary-action {
    color: var(--course-ink) !important;
    border-bottom: 1px solid var(--course-ink);
  }

  .course-facts {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    border-top: 1px solid var(--course-ink);
    border-bottom: 1px solid var(--course-line);
  }

  .course-facts > div {
    min-height: 7rem;
    padding: 1.2rem 1.4rem;
    border-left: 1px solid var(--course-line);
  }

  .course-facts > div:first-child {
    border-left: 0;
    padding-left: 0;
  }

  .course-facts span,
  .course-details dt {
    display: block;
    margin-bottom: 0.35rem;
    color: var(--course-muted);
    font-size: 0.76rem;
    font-weight: 700;
    text-transform: uppercase;
  }

  .course-facts strong {
    display: block;
    font-size: 1rem;
  }

  .home-section {
    padding: 5rem 0;
    border-bottom: 1px solid var(--course-line);
  }

  .section-heading {
    display: grid;
    grid-template-columns: 0.85fr 1.25fr;
    column-gap: 4rem;
    align-items: start;
    margin-bottom: 3.2rem;
  }

  .section-heading .section-kicker {
    grid-column: 1;
  }

  .section-heading h2 {
    grid-column: 1;
    margin: 0;
    border: 0;
    font-size: 3rem;
    font-weight: 500;
    line-height: 1.08;
  }

  .section-heading > p:last-child {
    grid-column: 2;
    grid-row: 1 / span 2;
    max-width: 34rem;
    margin: 0.15rem 0 0;
    color: var(--course-muted);
    font-size: 1.08rem;
  }

  .section-heading.compact {
    display: block;
    max-width: 720px;
  }

  .lens-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    border-top: 1px solid var(--course-ink);
    border-bottom: 1px solid var(--course-line);
  }

  .lens-grid article {
    min-height: 15rem;
    padding: 1.4rem 2rem 1.6rem;
    border-left: 1px solid var(--course-line);
  }

  .lens-grid article:first-child {
    border-left: 0;
    padding-left: 0;
  }

  .lens-index {
    color: var(--course-warm);
    font-size: 0.76rem;
    font-weight: 800;
  }

  .lens-grid h3 {
    margin: 3.5rem 0 0.8rem;
    font-size: 1.55rem;
  }

  .lens-grid p {
    margin: 0;
    color: var(--course-muted);
  }

  .structure-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(360px, 0.9fr);
    gap: 5rem;
    align-items: start;
  }

  .structure-copy {
    max-width: 42rem;
    font-size: 1.08rem;
  }

  .structure-copy p:first-child {
    margin-top: 0;
  }

  .course-details {
    margin: 0;
    border-top: 1px solid var(--course-ink);
  }

  .course-details > div {
    display: grid;
    grid-template-columns: 7rem 1fr;
    gap: 1rem;
    padding: 1rem 0;
    border-bottom: 1px solid var(--course-line);
  }

  .course-details dt,
  .course-details dd {
    margin: 0;
  }

  .grading-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    border-top: 1px solid var(--course-ink);
    border-bottom: 1px solid var(--course-line);
  }

  .grading-grid > * {
    min-height: 8.5rem;
    padding: 1.2rem 1.3rem;
    border-left: 1px solid var(--course-line);
    color: var(--course-ink) !important;
  }

  .grading-grid > *:first-child {
    border-left: 0;
    padding-left: 0;
  }

  .grading-grid strong,
  .grading-grid span {
    display: block;
  }

  .grading-grid strong {
    font-family: "Iowan Old Style", Charter, Georgia, serif;
    font-size: 2.4rem;
    font-weight: 500;
  }

  .grading-grid span {
    margin-top: 1rem;
    color: var(--course-muted);
    font-size: 0.88rem;
    font-weight: 700;
  }

  .section-footnote {
    max-width: 800px;
    margin: 1.3rem 0 0;
    color: var(--course-muted);
    font-size: 0.9rem;
  }

  .schedule-section {
    padding-bottom: 5.5rem;
  }

  .schedule-intro {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 3rem;
    margin-bottom: 1.5rem;
  }

  .schedule-intro .section-heading {
    margin: 0;
  }

  .schedule-intro > p {
    max-width: 420px;
    margin: 0 0 0.35rem;
    color: var(--course-muted);
    font-size: 0.9rem;
  }

  .schedule-note {
    max-width: 880px;
    margin: 0 0 1.2rem;
    color: var(--course-muted);
    font-size: 0.84rem;
    line-height: 1.5;
  }

  .schedule-board {
    margin: 0;
    border-top: 1px solid var(--course-ink);
  }

  .schedule-head,
  .schedule-week {
    display: grid;
    grid-template-columns: 120px minmax(0, 1fr) minmax(0, 1fr) 185px;
  }

  .schedule-head {
    min-height: 2.6rem;
    align-items: center;
    color: var(--course-muted);
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
  }

  .schedule-head > span,
  .schedule-week > div {
    padding: 0.65rem 0.9rem;
    border-left: 1px solid var(--course-line);
  }

  .schedule-head > span:first-child,
  .schedule-week > div:first-child {
    border-left: 0;
    padding-left: 0;
  }

  .schedule-week {
    min-height: 5.2rem;
    align-items: stretch;
    border-top: 1px solid var(--course-line);
  }

  .schedule-week:nth-child(odd) {
    background: rgba(255, 255, 255, 0.46);
  }

  .week-stamp,
  .class-slot,
  .deliverable {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .week-number {
    color: var(--course-ink);
    font-size: 0.8rem;
    font-weight: 800;
  }

  .week-date {
    margin-top: 0.12rem;
    color: var(--course-muted);
    font-size: 0.76rem;
  }

  .class-slot,
  .deliverable {
    font-size: 0.88rem;
    line-height: 1.4;
  }

  .class-slot p {
    margin: 0;
  }

  .class-slot.muted {
    color: var(--course-muted);
  }

  .deliverable {
    color: var(--course-accent);
    font-weight: 800;
  }

  .deliverable.empty {
    min-height: 0;
  }

  .resource-band {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 3rem;
    padding: 5rem 0;
    border-bottom: 1px solid var(--course-line);
  }

  .resource-band h2 {
    max-width: 720px;
    margin: 0;
    border: 0;
    font-size: 2.6rem;
    line-height: 1.12;
  }

  .course-footer {
    display: flex;
    min-height: 7rem;
    align-items: center;
    justify-content: space-between;
    color: var(--course-muted);
    font-size: 0.8rem;
  }

  .markdown-body table {
    border-collapse: collapse;
    background: var(--course-panel);
  }

  .markdown-body table th {
    background: var(--course-accent-soft);
  }

  .markdown-body table td,
  .markdown-body table th {
    border-color: var(--course-line);
    padding: 0.65rem 0.8rem;
  }

      padding: 1rem 0;

      max-width: 18rem;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 0.6rem 1.1rem;
    }

    .course-hero {
      padding: 4.5rem 0 3rem;
    }

    .course-hero h1 {
      font-size: 3.5rem;
    }

    .hero-lede {
      font-size: 1.3rem;
    }

    .course-facts {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .course-facts > div,
    .course-facts > div:first-child {
      min-height: 6.5rem;
      padding: 1rem;
      border-top: 1px solid var(--course-line);
    }

    .course-facts > div:nth-child(odd) {
      border-left: 0;
    }

    .course-facts > div:nth-child(-n + 2) {
      border-top: 0;
    }

    .home-section {
      padding: 4rem 0;
    }

    .section-heading {
      display: block;
      margin-bottom: 2.4rem;
    }

    .section-heading h2 {
      font-size: 2.45rem;
    }

    .section-heading > p:last-child {
      margin-top: 1.25rem;
    }

    .lens-grid {
      grid-template-columns: 1fr;
    }

    .lens-grid article,
    .lens-grid article:first-child {
      min-height: auto;
      padding: 1.4rem 0 1.6rem;
      border-top: 1px solid var(--course-line);
      border-left: 0;
    }

    .lens-grid article:first-child {
      border-top: 0;
    }

    .lens-grid h3 {
      margin-top: 1.2rem;
    }

    .structure-grid {
      grid-template-columns: 1fr;
      gap: 2.5rem;
    }

    .grading-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grading-grid > *,
    .grading-grid > *:first-child {
      min-height: 7rem;
      padding: 1rem;
      border-top: 1px solid var(--course-line);
    }

    .grading-grid > *:nth-child(odd) {
      border-left: 0;
    }

    .grading-grid > *:nth-child(-n + 2) {
      border-top: 0;
    }

    .grading-grid > *:last-child {
      grid-column: 1 / -1;
    }

    .schedule-intro {
      display: block;
    }

    .schedule-intro > p {
      margin-top: 1.2rem;
    }

    .schedule-head,
    .schedule-week {
      grid-template-columns: 78px minmax(0, 1fr) minmax(0, 1fr);
    }

    .deliverable-heading {
      display: none;
    }

    .schedule-head > span,
    .schedule-week > div {
      padding: 0.65rem 0.6rem;
    }

    .schedule-week {
      min-height: 5.5rem;
    }

    .class-slot,
    .deliverable {
      overflow-wrap: anywhere;
      font-size: 0.78rem;
    }

    .deliverable {
      grid-column: 2 / 4;
      min-height: 2.15rem;
      padding-top: 0.38rem !important;
      padding-bottom: 0.38rem !important;
      border-top: 1px solid var(--course-line);
    }

    .deliverable:not(.empty)::before {
      content: "Due: ";
      display: inline;
      color: var(--course-muted);
      font-weight: 600;
    }

    .deliverable.empty {
      display: none;
    }

    .resource-band {
      display: block;
      padding: 4rem 0;
    }

    .resource-band h2 {
      margin-bottom: 2rem;
      font-size: 2.2rem;
    }
  }

  @media (max-width: 520px) {
    .course-nav {
      display: block;
    }

    .course-nav-links {
      justify-content: flex-start;
      margin-top: 0.8rem;
    }

    .course-hero h1 {
      font-size: 3rem;
    }

    .hero-actions {
      align-items: flex-start;
      flex-direction: column;
    }

    .course-details > div {
      grid-template-columns: 1fr;
      gap: 0.25rem;
    }

    .schedule-head,
    .schedule-week {
      grid-template-columns: 70px minmax(0, 1fr) minmax(0, 1fr);
    }

    .schedule-head > span,
    .schedule-week > div {
      padding-right: 0.45rem;
      padding-left: 0.45rem;
    }

    .schedule-head > span:first-child,
    .schedule-week > div:first-child {
      padding-left: 0;
    }

    .course-footer {
      align-items: flex-start;
      flex-direction: column;
      justify-content: center;
      gap: 0.35rem;
    }
  }
</style>
