name: Data Privacy Course, UVA, Fall 2026
title: null
theme: jekyll-theme-primer

plugins:
  - jekyll-default-layout
  - jekyll-seo-tag

# Keep private/back-up-only course materials out of the published site.
exclude:
  - _site
  - .bundle
  - .claude
  - .git
  - .github
  - .jekyll-cache
  - .pytest_cache
  - .playwright-cli
  - .sass-cache
  - .venv
  - .venv-labs
  - .vscode
  - vendor
  - notes
  - materials
  - labs
  - grading
  - solutions
  - project/
  - note.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - GEMINI.md
  - CLAUDE.md
