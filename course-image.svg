<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#1C5B5A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#E76F51"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0 L0 0 0 80" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <circle cx="1300" cy="140" r="280" fill="#F4A261" opacity="0.2"/>
  <circle cx="220" cy="760" r="240" fill="#E76F51" opacity="0.18"/>

  <rect x="100" y="200" width="520" height="10" fill="url(#accent)"/>

  <text x="100" y="320" fill="#F7F4EF" font-size="96" font-family="Alegreya, Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="2">Data Privacy</text>
  <text x="100" y="400" fill="#F7F4EF" font-size="40" font-family="Source Sans Pro, 'Helvetica Neue', Arial, sans-serif" font-weight="500" letter-spacing="1">Spring 2026</text>
  <text x="100" y="460" fill="#E6DCCF" font-size="28" font-family="Source Sans Pro, 'Helvetica Neue', Arial, sans-serif" font-weight="400" letter-spacing="0.5">University of Virginia</text>

  <g transform="translate(1100 320)" opacity="0.92">
    <rect x="0" y="140" width="260" height="220" rx="24" fill="#F4A261"/>
    <path d="M60 140 V90 C60 40 200 40 200 90 V140" fill="none" stroke="#F7F4EF" stroke-width="18"/>
    <circle cx="130" cy="230" r="20" fill="#1C5B5A"/>
    <rect x="122" y="230" width="16" height="60" fill="#1C5B5A"/>
  </g>
</svg>
